<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaTopUp Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#090b18;color:#f5f5ff;font:15px system-ui,Arial;background-image:radial-gradient(at 15% 0%,#30205d,transparent 45%)}.wrap{max-width:1100px;margin:auto;padding:22px}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.brand{font-size:22px;font-weight:900}.brand span{color:#c4b5fd}.hero,.card{background:linear-gradient(145deg,#191c3b,#101329);border:1px solid #34365e;border-radius:18px;padding:20px}.hero{padding:32px;background:linear-gradient(100deg,#171033,#25164d);margin:15px 0}.hero h1{font-size:clamp(30px,5vw,48px);margin:8px 0}.muted{color:#a8b0d0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.section{margin:22px 0}.section h2{font-size:19px}.package{text-align:center;cursor:pointer;transition:.2s}.package:hover,.selected{border-color:#b78cff;box-shadow:0 0 18px #8b5cf633;transform:translateY(-2px)}.icon{font-size:30px}.price{font-weight:800;margin-top:8px;color:#d8b4fe}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field input,.field select{background:#0c1024;color:white;border:1px solid #34365e;padding:12px;border-radius:10px}.btn{background:linear-gradient(110deg,#7c3aed,#db2777);border:0;color:white;padding:12px 16px;border-radius:11px;font-weight:800;cursor:pointer}.outline{background:#202448;border:1px solid #34365e}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.pay{display:flex;align-items:center;gap:9px}.summary{position:sticky;top:12px}.total{font-size:25px;color:#c4b5fd;font-weight:900}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);opacity:0;background:#15213a;border:1px solid #4ade80;padding:14px 20px;border-radius:12px;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{display:none;position:fixed;inset:0;background:#050611dd;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.success{max-width:420px;text-align:center;background:#191936;border:1px solid #a78bfa;border-radius:22px;padding:28px;animation:pop .4s}.big{font-size:55px;animation:float 1.5s infinite}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #303456;text-align:left}.table input{width:110px;background:#0b1022;color:white;border:1px solid #3b4269;padding:8px;border-radius:8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.side{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.side a{color:#ddd;text-decoration:none;background:#191c3b;padding:10px;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats strong{font-size:24px;display:block}.note{background:#151d36;border:1px solid #34466e;border-radius:12px;padding:12px;color:#cbd5e1;font-size:13px}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes confetti{to{transform:translateY(110vh) rotate(700deg);opacity:0}}@media(max-width:720px){.cols{grid-template-columns:1fr}.summary{position:static}.wrap{padding:13px}.stats{grid-template-columns:1fr}.hero{padding:22px}}</style><body><div class="wrap"><header class="nav"><div class="brand">✦ NOVA<span>ADMIN</span></div><span class="muted">Control Center</span></header><nav class="side"><a href="#games">Game & Paket</a><a href="#payment">Pembayaran</a><a href="#site">Website</a></nav><h1>Dashboard Admin</h1><div class="stats"><div class="card"><span class="muted">Game</span><strong id="gc"></strong></div><div class="card"><span class="muted">Paket</span><strong id="pc"></strong></div><div class="card"><span class="muted">Metode bayar</span><strong id="mc"></strong></div></div><section class="section card" id="games"><div class="row"><h2>Game & Harga</h2><button class="btn" onclick="addGame()">＋ Tambah Game</button></div><div id="edit"></div><button class="btn" onclick="save()">Simpan Semua</button></section><section class="section card" id="payment"><h2>Metode Pembayaran & ID</h2><div id="pays"></div><div class="row"><button class="btn outline" onclick="addPay()">＋ Tambah Metode</button><button class="btn" onclick="save()">Simpan Pembayaran</button></div></section><section class="section card" id="site"><h2>Informasi Website</h2><div class="field"><label>Nama toko</label><input value="NovaTopUp"></div><div class="field"><label>Pengumuman</label><input placeholder="Promo atau info toko"></div><button class="btn" onclick="save()">Simpan</button></section><p class="note">Demo admin menggunakan localStorage browser. Untuk live, perlu backend, login admin, database, dan payment gateway. Harga contoh.</p></div><div class="toast" id="toast"></div><script>let data={"games": [{"id": 0, "name": "Mobile Legends", "icon": "⚔️", "unit": "Diamond", "products": [{"id": 0, "amount": 86, "price": 16000}, {"id": 1, "amount": 172, "price": 31000}, {"id": 2, "amount": 257, "price": 44000}, {"id": 3, "amount": 344, "price": 58000}, {"id": 4, "amount": 429, "price": 72000}, {"id": 5, "amount": 514, "price": 86000}, {"id": 6, "amount": 706, "price": 114000}, {"id": 7, "amount": 1024, "price": 168000}]}, {"id": 1, "name": "Free Fire", "icon": "🔥", "unit": "Diamond", "products": [{"id": 0, "amount": 70, "price": 10000}, {"id": 1, "amount": 140, "price": 20000}, {"id": 2, "amount": 355, "price": 50000}, {"id": 3, "amount": 720, "price": 100000}, {"id": 4, "amount": 1450, "price": 200000}]}, {"id": 2, "name": "PUBG Mobile", "icon": "🎯", "unit": "UC", "products": [{"id": 0, "amount": 60, "price": 15000}, {"id": 1, "amount": 325, "price": 75000}, {"id": 2, "amount": 660, "price": 150000}, {"id": 3, "amount": 1800, "price": 375000}]}, {"id": 3, "name": "Genshin Impact", "icon": "🌌", "unit": "Genesis Crystal", "products": [{"id": 0, "amount": 60, "price": 16000}, {"id": 1, "amount": 300, "price": 79000}, {"id": 2, "amount": 980, "price": 239000}]}, {"id": 4, "name": "Honkai: Star Rail", "icon": "🚄", "unit": "Oneiric Shard", "products": [{"id": 0, "amount": 60, "price": 16000}, {"id": 1, "amount": 300, "price": 79000}, {"id": 2, "amount": 980, "price": 239000}]}, {"id": 5, "name": "Roblox", "icon": "🧱", "unit": "Robux", "products": [{"id": 0, "amount": 80, "price": 16000}, {"id": 1, "amount": 400, "price": 79000}, {"id": 2, "amount": 800, "price": 149000}]}, {"id": 6, "name": "Valorant", "icon": "🎮", "unit": "VP", "products": [{"id": 0, "amount": 125, "price": 15000}, {"id": 1, "amount": 420, "price": 50000}, {"id": 2, "amount": 700, "price": 80000}, {"id": 3, "amount": 1375, "price": 150000}]}, {"id": 7, "name": "Call of Duty Mobile", "icon": "💥", "unit": "CP", "products": [{"id": 0, "amount": 80, "price": 15000}, {"id": 1, "amount": 420, "price": 75000}, {"id": 2, "amount": 880, "price": 150000}]}, {"id": 8, "name": "Wild Rift", "icon": "🛡️", "unit": "Wild Core", "products": [{"id": 0, "amount": 125, "price": 16000}, {"id": 1, "amount": 420, "price": 49000}, {"id": 2, "amount": 1000, "price": 109000}]}, {"id": 9, "name": "Arena of Valor", "icon": "🏆", "unit": "Voucher", "products": [{"id": 0, "amount": 40, "price": 10000}, {"id": 1, "amount": 250, "price": 50000}, {"id": 2, "amount": 500, "price": 99000}]}, {"id": 10, "name": "Magic Chess: Go Go", "icon": "♟️", "unit": "Diamonds", "products": [{"id": 0, "amount": 60, "price": 15000}, {"id": 1, "amount": 300, "price": 75000}]}, {"id": 11, "name": "Sausage Man", "icon": "🌭", "unit": "Candy", "products": [{"id": 0, "amount": 60, "price": 15000}, {"id": 1, "amount": 300, "price": 75000}]}], "payments": [{"name": "DANA", "detail": "ID pembayaran demo"}, {"name": "GoPay", "detail": "ID pembayaran demo"}, {"name": "OVO", "detail": "ID pembayaran demo"}, {"name": "QRIS", "detail": "ID pembayaran demo"}]};
try{data=JSON.parse(localStorage.getItem('novaMultiData'))||data}catch(e){}
function render(){document.querySelector('#edit').innerHTML=data.games.map((g,i)=>`<div class="card" style="margin:12px 0"><div class="row"><div class="field" style="flex:2"><label>Nama game</label><input value="${g.name}" onchange="data.games[${i}].name=this.value"></div><div class="field"><label>Icon</label><input value="${g.icon}" onchange="data.games[${i}].icon=this.value"></div><div class="field"><label>Unit</label><input value="${g.unit}" onchange="data.games[${i}].unit=this.value"></div><button class="btn" style="background:#9f2945" onclick="data.games.splice(${i},1);render()">Hapus Game</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Nominal</th><th>Harga Rp</th><th>Aksi</th></tr></thead><tbody>${g.products.map((p,j)=>`<tr><td><input type="number" value="${p.amount}" onchange="data.games[${i}].products[${j}].amount=+this.value"></td><td><input type="number" value="${p.price}" onchange="data.games[${i}].products[${j}].price=+this.value"></td><td><button class="btn" style="background:#9f2945;padding:7px" onclick="data.games[${i}].products.splice(${j},1);render()">×</button></td></tr>`).join('')}</tbody></table></div><button class="btn outline" onclick="data.games[${i}].products.push({id:Date.now(),amount:100,price:10000});render()">＋ Tambah Paket</button></div>`).join('');document.querySelector('#pays').innerHTML=data.payments.map((p,i)=>`<div class="row card" style="margin:8px 0"><div class="field" style="flex:1"><label>Metode</label><input value="${p.name}" onchange="data.payments[${i}].name=this.value"></div><div class="field" style="flex:2"><label>ID / Nomor / Instruksi</label><input value="${p.detail}" onchange="data.payments[${i}].detail=this.value"></div><button class="btn" style="background:#9f2945" onclick="data.payments.splice(${i},1);render()">×</button></div>`).join('');document.querySelector('#gc').textContent=data.games.length;document.querySelector('#pc').textContent=data.games.reduce((n,g)=>n+g.products.length,0);document.querySelector('#mc').textContent=data.payments.length}
function addGame(){data.games.push({id:Date.now(),name:'Game Baru',icon:'🎮',unit:'Item',products:[{id:1,amount:100,price:10000}]});render()}function addPay(){data.payments.push({name:'Metode Baru',detail:'Isi ID pembayaran'});render()}
function save(){localStorage.setItem('novaMultiData',JSON.stringify(data));let e=document.querySelector('#toast');e.textContent='Pengaturan tersimpan di browser';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}render();</script></body></html>
